<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR Kamera Sederhana</title>
    <!-- Memuat A-Frame dan Mind-AR untuk WebAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .ar-instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="ar-instructions">
        Arahkan kamera ke Marker MindAR (Default: Kartu/Gambar Target)
    </div>

    <!-- Scene AR menggunakan Mind-AR dan A-Frame -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <!-- Aset yang akan dimuat -->
        <a-assets>
            <img id="card" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/examples/image-tracking/assets/card-example/card.png">
        </a-assets>

        <!-- Kamera AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target Marker dan Objek AR di atasnya -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Contoh Objek AR: Kotak 3D Ungu yang berputar -->
            <a-box position="0 0.4 0" materiales="color: #4CC3D9;" rotation="0 45 0" scale="0.5 0.5 0.5" animation="property: rotation; to: 360 300 0; loop: true; dur: 10000"></a-box>
            
            <!-- Atau menampilkan teks/gambar di atas marker -->
            <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        </a-entity>

    </a-scene>

</body>
</html>
