<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom WebAR 3D</title>
    <!-- Memuat A-Frame dan Mind-AR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Scene AR dengan file .mind buatan sendiri -->
    <a-scene mindar-image="imageTargetSrc: target.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <!-- Memuat aset 3D Anda -->
        <a-assets>
            <a-asset-item id="model3d" src="model-anda.glb"></a-asset-item>
        </a-assets>

        <!-- Kamera AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target Marker (Index 0 adalah gambar pertama di file .mind) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Menampilkan objek 3D di atas marker -->
            <a-gltf-model src="#model3d" position="0 0 0" scale="0.5 0.5 0.5" rotation="0 180 0"></a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
